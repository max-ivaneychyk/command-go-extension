<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Settings</title>
    <style>
        body[data-mode="dark"] {
            background: #141414;
            color: #b7b7b7;
        }
    </style>
</head>

<body class="" data-mode="dark">
<div id="root">
    <main>
        <style>
            body {
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                /*background: #e1e2e3;*/
                background: #141414;
                font-weight: 600;
                font-size: 0.875rem;
                line-height: 1.25rem;
                /*color: rgba(0, 0, 0, 0.91);*/
                color: grey;
            }

            .loading {
                text-align: center;
                margin: 40px auto;
            }

            .spinner {
                box-sizing: border-box;
                width: 60px;
                height: 60px;
                padding: 3px;
                overflow: visible !important;
            }

            .spinner > circle {
                fill: none;
                stroke: currentColor;
                cx: 50%;
                cy: 50%;
                r: 50%;
                stroke-width: 6px;
                stroke-linecap: round;
                transform-origin: center;
            }
        </style>

        <!-- Check out other spinners in: https://codepen.io/collection/NqkmLZ-->
        <svg class="spinner">
            <circle>
                <animateTransform attributeName="transform" type="rotate" values="-90;810" keyTimes="0;1" dur="2s"
                                  repeatCount="indefinite"></animateTransform>
                <animate attributeName="stroke-dashoffset" values="0%;0%;-157.080%" calcMode="spline"
                         keySplines="0.61, 1, 0.88, 1; 0.12, 0, 0.39, 0" keyTimes="0;0.5;1" dur="2s"
                         repeatCount="indefinite"></animate>
                <animate attributeName="stroke-dasharray" values="0% 314.159%;157.080% 157.080%;0% 314.159%"
                         calcMode="spline" keySplines="0.61, 1, 0.88, 1; 0.12, 0, 0.39, 0" keyTimes="0;0.5;1" dur="2s"
                         repeatCount="indefinite"></animate>
            </circle>
        </svg>
        <p class="loading">Please Wait..</p>
    </main>
</div>
</body>
</html>
